# nginx config for the production frontend image (Dockerfile `production` stage).
# Listens on 3000 so docker-compose port mappings are identical in dev and prod.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server_tokens off;

    # The stock mime.types has no .mjs entry, so the bundled pdf.js worker
    # (assets/pdf.worker.min-*.mjs) was served as application/octet-stream and
    # browsers refused to load it as a module. A server-level `types` block
    # replaces the inherited map, so pull the stock one in first, then add mjs.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Browser security headers. They live at server level so every response
    # gets them, including /api/ and error responses (`always`). nginx only
    # inherits add_header into a location that declares none of its own, so
    # don't add add_header inside the locations below without repeating these.
    #
    # CSP notes:
    # - style-src 'unsafe-inline': MUI/Emotion inject <style> tags at runtime.
    # - worker-src/connect-src blob:: pdf.js worker is bundled (same origin);
    #   documents are opened from blob: object URLs; Sentry replay compresses
    #   in a blob: worker.
    # - img-src https:: the org logo URL is admin-configured and may be remote.
    # - connect-src Sentry ingest hosts: only used when VITE_SENTRY_DSN is set.
    # - No 'unsafe-eval': pdf.js runs with isEvalSupported=false.
    # HSTS is not set here: TLS terminates at the upstream proxy, which should
    # send Strict-Transport-Security.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Proxy API calls to the backend service — same path the Vite dev proxy
    # uses, so the frontend's relative /api/v1 base URL works in both modes.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Matches MAX_FILE_SIZE (100 MB) in backend/src/documents/processing_service.py
        client_max_body_size 100m;
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        try_files $uri /index.html;
    }
}
