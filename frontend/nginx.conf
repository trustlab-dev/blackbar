# nginx config for the production frontend image (Dockerfile `production` stage).
# Listens on 3000 so docker-compose port mappings are identical in dev and prod.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy API calls to the backend service — same path the Vite dev proxy
    # uses, so the frontend's relative /api/v1 base URL works in both modes.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Headroom above the backend's MAX_UPLOAD_SIZE (20MB default).
        client_max_body_size 25m;
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        try_files $uri /index.html;
    }
}
